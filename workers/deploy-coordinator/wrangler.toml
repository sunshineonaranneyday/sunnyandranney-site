name = "deploy-coordinator"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[durable_objects]
bindings = [
  { name = "DEPLOY_COORDINATOR", class_name = "DeployCoordinator" }
]

[[migrations]]
tag = "v1"
new_classes = ["DeployCoordinator"]

# CF_DEPLOY_HOOK_URL set via:
# wrangler secret put CF_DEPLOY_HOOK_URL --config workers/deploy-coordinator/wrangler.toml

# Nightly at 3 AM Eastern (8:00 UTC; 4 AM in summer): the website's full sync and a rebuild.
[triggers]
crons = ["0 8 * * *"]

[vars]
SITE_SYNC_URL = "https://sunnyandranney.com/api/sync-products/"
