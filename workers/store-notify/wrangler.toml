# store-notify: the store's outgoing email that isn't the sales tax report.
# Today: special-order requests from the website (src/lib/store-notify/special-orders.mjs).
# Deploy: npm run deploy:store-notify
name = "store-notify"
main = "src/index.ts"
compatibility_date = "2026-01-14"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "sunnyandranney-db"
database_id = "a3fbfba9-569c-4dae-af1a-4a1f290963f7"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["requests@mail.sunnyandranney.com"]
